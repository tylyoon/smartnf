spring.application.name=smartnf
server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never

# 로컬 MySQL 연결
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartnf}
spring.datasource.username=${DB_USERNAME:smartnf_app}
spring.datasource.password=${DB_PASSWORD}

# 테이블 생성·변경은 별도 관리
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Optional SMTP for dual-mailbox email change confirmation. Disabled until configured.
smartnf.account.mail-enabled=${SMARTNF_ACCOUNT_MAIL_ENABLED:false}
smartnf.account.mail-from=${SMARTNF_ACCOUNT_MAIL_FROM:}
spring.mail.host=${SMARTNF_SMTP_HOST:}
spring.mail.port=${SMARTNF_SMTP_PORT:587}
spring.mail.username=${SMARTNF_SMTP_USERNAME:}
spring.mail.password=${SMARTNF_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
